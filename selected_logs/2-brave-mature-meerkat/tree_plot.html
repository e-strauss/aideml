let treeStructData = {"edges": [[2, 6], [4, 5], [5, 8], [5, 7], [8, 9], [8, 10], [10, 13], [10, 14], [10, 15], [10, 11], [11, 12], [15, 16], [16, 17], [17, 19], [17, 21], [17, 20], [17, 18], [21, 22], [22, 23]], "layout": [[0.0, 0.0], [0.125, 0.0], [0.25, 0.0], [0.375, 0.0], [0.5, 0.0], [0.5, 0.11111111111111116], [0.25, 0.11111111111111116], [0.4375, 0.2222222222222222], [0.5625, 0.2222222222222222], [0.5, 0.33333333333333337], [0.625, 0.33333333333333337], [0.4375, 0.4444444444444444], [0.4375, 0.5555555555555556], [0.5625, 0.4444444444444444], [0.6875, 0.4444444444444444], [0.8125, 0.4444444444444444], [0.8125, 0.5555555555555556], [0.8125, 0.6666666666666667], [0.625, 0.7777777777777778], [0.75, 0.7777777777777778], [0.875, 0.7777777777777778], [1.0, 0.7777777777777778], [1.0, 0.8888888888888888], [1.0, 1.0]], "plan": ["I will aggregate each customer\u2019s most recent statement to one row, drop the few\ncategorical features for this baseline, and train a LightGBM binary classifier\nwith a 20\u00d7 negative-class weight to reflect the downsampling.  I\u2019ll evaluate\nperformance using the competition\u2019s weighted Gini and top-4%-captured metric via\n5\u2010fold stratified CV, reporting the mean score.  This simple snapshot approach\navoids complex feature engineering or ensembling but still captures the latest\ncredit profile.", "We aggregate each customer\u2019s history by taking the mean of every numeric feature\nto form a single-row profile per customer, dropping the few categorical\nvariables and the date. Missing values are imputed with a sentinel, and we merge\nwith the downsampled labels. We train an XGBoost classifier with a 20\u00d7 negative\nweight in a 5\u2010fold stratified CV and evaluate using the competition\u2019s weighted\nGini plus top\u20104% recall metric, reporting the mean score. This simple aggregated\nbaseline should run quickly and capture essential risk signals.", "We aggregate each customer\u2019s most recent statement profile by sorting on `S_2`\nand dropping duplicates, while retaining all numeric and the 11 specified\ncategorical features. A CatBoostClassifier is trained with class weights (20\u00d7\nfor non\u2010defaults) in a 5\u2010fold stratified CV setup, using early stopping to\nprevent overfitting. We compute the competition\u2019s custom metric\u2014the mean of\nnormalized weighted Gini and top\u20104% default capture rate\u2014on each fold and report\nthe average score.", "We aggregate each customer\u2019s complete statement history into summary features\n(mean, std, min, max) across all numerical variables, dropping the known\ncategorical fields and imputing missing values with a sentinel. We then merge\nthese customer\u2010level profiles with the downsampled labels and train a LightGBM\nbinary classifier using 5\u2010fold stratified cross\u2010validation with per\u2010sample\nweights (20\u00d7 on non\u2010defaults). We evaluate on each fold using the competition\u2019s\nnormalized weighted Gini plus top\u20104% default capture rate metric and report the\nmean CV score.", "We compute exponentially weighted moving averages for all numeric features per\ncustomer\u2014emphasizing recent behavior\u2014and extract the final EWM values to\nrepresent each customer\u2019s profile. We merge these recency\u2010aware features with\nthe downsampled labels and train a CatBoost classifier with class_weights=[20,1]\nto counteract the negative\u2010class downsampling. We perform 5\u2010fold stratified\ncross\u2010validation evaluating the Amex metric (normalized weighted Gini plus top\n4% default capture) and report the mean score. This approach is simple yet\nleverages temporal weighting and a robust tree\u2010based model without extensive\nfeature engineering or ensembling.", "I propose to augment the feature set by including each numeric feature\u2019s last\nraw observed value alongside its exponentially weighted moving average, allowing\nthe model to capture both smoothed trends and the most recent actual values.\nWe\u2019ll extract the raw last statement per customer, suffix these columns with\n\u201c_raw\u201d, concatenate them with the EWM features, and retrain the CatBoost model\nunder the same CV setup to measure the metric improvement.", "I have corrected the normalized Gini computation by dividing the model\u2019s\nweighted Gini by the weighted Gini of a perfect model (using true labels as\npredictions). The `amex_metric` now properly implements\n`top_four_percent_captured`, `weighted_gini`, and `normalized_weighted_gini`. I\nthen rerun 5-fold stratified CV with the fixed metric and print each fold\u2019s\nscore and the mean CV score.", "We add trend (\u201cdelta\u201d) features representing the change from each feature\u2019s\nsecond\u2010last to last raw value per customer to capture abrupt behavioral shifts.\nThese deltas are zero\u2010filled when only one statement exists. We append them to\nthe existing EWM and raw last\u2010value features, then retrain the same CatBoost\nmodel under 5\u2010fold stratified CV and report the updated AMEX metric.", "I will augment the feature matrix with per-customer standard deviations of each\nnumeric feature, capturing the volatility of balances, payments, and risk\nsignals over time. Specifically, I\u2019ll group the full statement history by\ncustomer_ID to compute the std for all numeric columns, align these std values\nwith each customer\u2019s last EWM row, fill NaNs with zero (for customers with only\none statement), and suffix these features with \u201c_std.\u201d Finally, I\u2019ll concatenate\nthe std features with the existing EWM and raw last-value features, retrain the\nCatBoost model under 5-fold stratified CV, and report the updated AMEX metric.", "I propose augmenting the feature set with each customer\u2019s total number of\nstatements (history length), which may capture the depth of available credit\nbehavior. We will compute this count per customer and merge it with the existing\nEWM, raw last\u2010value, and std features before training. This simple feature could\nprovide additional signal about customer tenure. We then retrain the CatBoost\nmodel under the same 5\u2010fold stratified cross\u2010validation and report the updated\nAMEX metric.", "I will add frequency\u2010encoded representations of the dropped categorical features\nto capture their distributional information. Specifically, I\u2019ll compute the\noverall frequency of each category value in the training data, then map each\ncustomer\u2019s last\u2010statement category values to these frequencies as new features.\nThese frequency\u2010encoded features will be concatenated to the existing EWM, raw,\nand std feature sets before retraining the CatBoost model under the same 5\u2010fold\nstratified CV. This simple encoding can introduce valuable categorical signal\nwithout complex target\u2010encoding leakage.", "I propose to leverage CatBoost\u2019s native categorical handling by including the\nlast\u2010statement categorical variables directly as `cat_features` instead of\nfrequency encoding them. We will drop the manual frequency\u2010encoded features,\nconcatenate the raw last\u2010statement cats with the EWM, raw numeric, and std\nfeatures, and pass their column indices to `CatBoostClassifier`. This change\nshould allow CatBoost to automatically find optimal encodings for those\nvariables and potentially improve predictive performance. We keep the same\n5\u2010fold stratified CV and AMEX metric evaluation to measure the impact.", "I will convert all CatBoost categorical feature columns from floats to strings,\nfilling missing values with a placeholder, so CatBoost recognizes them\ncorrectly. This involves casting the final X_cat dataframe to string type before\nconcatenation, then recomputing the categorical feature indices on the updated\nfeature matrix. The rest of the training and AMEX metric computation remains\nunchanged, and I will print the mean cross-validated AMEX metric at the end.", "I will replace the global frequency encoding of categorical features with a\nfold\u2010wise smoothed target encoding to better capture each category\u2019s\nrelationship with default risk. For each CV fold, I compute per\u2010category target\nmeans with smoothing on the training split and apply these encodings to both\ntrain and validation sets, filling unseen categories with the global mean. This\nchange should improve the signal from categorical variables without altering the\nrest of the feature pipeline or model. The EWM, raw last values, std features,\nand CatBoost training remain unchanged.", "We augment the feature matrix by adding per\u2010customer minimum and maximum values\nfor each numeric feature, capturing behavioral extremes. Specifically, we\ncompute the min and max across each customer\u2019s full history, suffix these\nfeatures with \u201c_min\u201d and \u201c_max\u201d, and concatenate them with the existing EWM, raw\nlast\u2010value, std, and frequency\u2010encoded features. We retrain the CatBoost model\nunder 5\u2010fold stratified cross\u2010validation and print the updated AMEX metric.", "I propose adding residual features computed as the difference between each\nfeature\u2019s last raw value and its exponential weighted moving average. These\nresiduals capture abrupt deviations from the customer\u2019s typical behavior, which\nmay signal increased default risk. We append these residuals to the existing\nEWM, raw, std, and frequency\u2010encoded features, then retrain the CatBoost model\nunder the same 5\u2010fold stratified CV setup and report the updated AMEX metric.", "I will augment the feature matrix by adding per-customer minimum and maximum\nvalues for each numeric feature, capturing the behavioral extremes that may\nsignal risk. Specifically, after computing the EWM, raw, std, freq\u2010encoded, and\nresidual features, I\u2019ll also compute grouped min and max across each customer\u2019s\nhistory, suffix them with \u201c_min\u201d and \u201c_max\u201d, and include these in the feature\nset. Then I\u2019ll rerun the same 5-fold stratified CatBoost CV and print the\nupdated AMEX metric.", "I propose adding per-customer \u201cdelta\u201d features computed as the difference\nbetween each numeric feature\u2019s last raw value and its second-to-last raw value,\ncapturing abrupt changes in customer behavior that may signal increased default\nrisk. We compute these deltas by shifting the sorted raw values per customer,\nfill missing with zero for customers with only one statement, append these delta\nfeatures to the existing feature matrix, and retrain the CatBoost model under\nthe same 5-fold stratified CV to measure any improvement in the AMEX metric.", "I will augment the feature matrix by computing per\u2010customer medians for each\nnumeric feature to capture a robust central tendency over their statement\nhistory. After grouping the full history to calculate medians, I\u2019ll align these\nmedian values with the existing EWM index, fill any missing values with zero,\nsuffix them with \u201c_median,\u201d and concatenate to the feature set. I\u2019ll then\nretrain the CatBoost model under the same 5\u2010fold stratified cross\u2010validation and\nprint the updated AMEX metric to measure the impact of these median features.", "I will augment the feature set by computing per-customer median values for each\nnumeric feature to capture robust central tendencies over the entire statement\nhistory. These median features, suffixed with \u201c_median\u201d, will be aligned with\nthe existing last-row EWM index, filling any missing medians with zero. I will\nthen append these new features to the current feature matrix and rerun the\n5-fold stratified CatBoost cross-validation, printing the updated mean AMEX\nmetric to assess the impact of this addition.", "We will augment the feature set by computing per-customer skewness for each\nnumeric feature, capturing asymmetry in their balance and payment histories that\nmay signal risk. Specifically, we group the full statement history to calculate\nthe skew of each feature, align these skew values with the last\u2010statement index,\nfill missing values with zero, suffix them with \u201c_skew,\u201d and concatenate to the\nexisting feature matrix. We then retrain the same CatBoost model under 5\u2010fold\nstratified cross\u2010validation and report the updated AMEX metric.", "I propose ensembling the existing CatBoost model with a complementary LightGBM\nmodel by averaging their out\u2010of\u2010fold predicted probabilities. This leverages\ndiverse tree\u2010based learners and often yields incremental gains in ranking and\nrecall metrics. We\u2019ll train both models per CV fold with identical class\nweights, average their probabilities for validation predictions, and compute the\nAMEX metric on the blended outputs. Finally, we print the mean cross\u2010validated\nAMEX score for the ensemble.", "I propose adding three-period trend features for each numeric variable, computed\nas the change between the last raw value and the value three statements prior\ndivided by three, to capture medium-term momentum in customer behavior. We will\ncompute these trends per customer, fill missing values with zero for customers\nwith fewer than four statements, and append them as new features suffixed\n\"_trend\". Finally, we retrain the same CatBoost + LightGBM ensemble under 5-fold\nstratified cross-validation and report the updated AMEX metric.", "I propose augmenting the feature set with each customer\u2019s statement count\n(history length), which can capture customer tenure and data richness. We\ncompute the number of statements per customer and merge this count as an\nadditional feature alongside the existing engineered features before training.\nThis simple yet potentially informative feature is added to the CatBoost +\nLightGBM ensemble under the same 5-fold stratified CV setup to measure its\nimpact on the AMEX metric."], "code": ["import pandas as pd\nimport numpy as np\nfrom sklearn.model_selection import StratifiedKFold\nimport lightgbm as lgb\nfrom sklearn.metrics import roc_auc_score\n\n\n# Competition metric\ndef amex_metric(y_true, y_pred):\n    # combine\n    df = pd.DataFrame({\"target\": y_true, \"prediction\": y_pred})\n    df = df.sort_values(\"prediction\", ascending=False)\n    df[\"weight\"] = df[\"target\"].apply(lambda x: 20 if x == 0 else 1)\n    # top4%\n    four_pct_cutoff = int(0.04 * df[\"weight\"].sum())\n    df[\"weight_cumsum\"] = df[\"weight\"].cumsum()\n    df_cut = df[df[\"weight_cumsum\"] <= four_pct_cutoff]\n    top4 = df_cut[\"target\"].sum() / df[\"target\"].sum()\n    # Gini\n    df[\"random\"] = (df[\"weight\"] / df[\"weight\"].sum()).cumsum()\n    total_pos = (df[\"target\"] * df[\"weight\"]).sum()\n    df[\"cum_pos_found\"] = (df[\"target\"] * df[\"weight\"]).cumsum()\n    df[\"lorentz\"] = df[\"cum_pos_found\"] / total_pos\n    df[\"gini\"] = (df[\"lorentz\"] - df[\"random\"]) * df[\"weight\"]\n    weighted_gini = df[\"gini\"].sum()\n    # normalized\n    df_true = df.copy()\n    df_true[\"prediction\"] = df_true[\"target\"]\n    # perfect\n    df_true = df_true.sort_values(\"prediction\", ascending=False)\n    df_true[\"weight\"] = df_true[\"target\"].apply(lambda x: 20 if x == 0 else 1)\n    df_true[\"random\"] = (df_true[\"weight\"] / df_true[\"weight\"].sum()).cumsum()\n    total_pos2 = (df_true[\"target\"] * df_true[\"weight\"]).sum()\n    df_true[\"cum_pos_found\"] = (df_true[\"target\"] * df_true[\"weight\"]).cumsum()\n    df_true[\"lorentz\"] = df_true[\"cum_pos_found\"] / total_pos2\n    df_true[\"gini\"] = (df_true[\"lorentz\"] - df_true[\"random\"]) * df_true[\"weight\"]\n    perfect_gini = df_true[\"gini\"].sum()\n    norm_gini = weighted_gini / perfect_gini\n    return 0.5 * (norm_gini + top4)\n\n\n# Load and aggregate latest snapshot per customer\ndata = pd.read_csv(\"./input/train_data_downsampled.csv\", parse_dates=[\"S_2\"])\ndata = data.sort_values([\"customer_ID\", \"S_2\"])\ndata = data.drop_duplicates(\"customer_ID\", keep=\"last\")\n\nlabels = pd.read_csv(\"./input/train_labels_downsampled.csv\")\ndf = data.merge(labels, on=\"customer_ID\", how=\"inner\")\n\n# Prepare features\ndrop_cols = [\n    \"customer_ID\",\n    \"S_2\",\n    \"B_30\",\n    \"B_38\",\n    \"D_114\",\n    \"D_116\",\n    \"D_117\",\n    \"D_120\",\n    \"D_126\",\n    \"D_63\",\n    \"D_64\",\n    \"D_66\",\n    \"D_68\",\n]\nX = df.drop(columns=drop_cols + [\"target\"])\ny = df[\"target\"].values\n\n# 5-fold CV\nskf = StratifiedKFold(n_splits=5, shuffle=True, random_state=42)\nscores = []\n\nfor train_idx, val_idx in skf.split(X, y):\n    X_train, X_val = X.iloc[train_idx], X.iloc[val_idx]\n    y_train, y_val = y[train_idx], y[val_idx]\n    model = lgb.LGBMClassifier(\n        n_estimators=100, learning_rate=0.1, class_weight={0: 20, 1: 1}, random_state=42\n    )\n    model.fit(\n        X_train,\n        y_train,\n        eval_set=[(X_val, y_val)],\n        eval_metric=\"auc\",\n        early_stopping_rounds=10,\n        verbose=False,\n    )\n    preds = model.predict_proba(X_val)[:, 1]\n    score = amex_metric(y_val, preds)\n    scores.append(score)\n    print(f\"Fold metric: {score:.6f}\")\n\nprint(f\"Mean CV metric: {np.mean(scores):.6f}\")", "import pandas as pd\nimport numpy as np\nfrom sklearn.model_selection import StratifiedKFold\nimport xgboost as xgb\n\n\n# Competition metric\ndef amex_metric(y_true: pd.DataFrame, y_pred: pd.DataFrame) -> float:\n    def top_four_percent_captured(y_true, y_pred):\n        df = pd.concat([y_true, y_pred], axis=1).sort_values(\n            \"prediction\", ascending=False\n        )\n        df[\"weight\"] = df[\"target\"].apply(lambda x: 20 if x == 0 else 1)\n        cutoff = int(0.04 * df[\"weight\"].sum())\n        df[\"wcum\"] = df[\"weight\"].cumsum()\n        return (df.loc[df[\"wcum\"] <= cutoff, \"target\"] == 1).sum() / (\n            df[\"target\"] == 1\n        ).sum()\n\n    def weighted_gini(y_true, y_pred):\n        df = pd.concat([y_true, y_pred], axis=1).sort_values(\n            \"prediction\", ascending=False\n        )\n        df[\"weight\"] = df[\"target\"].apply(lambda x: 20 if x == 0 else 1)\n        df[\"rand\"] = df[\"weight\"].cumsum() / df[\"weight\"].sum()\n        df[\"cum_pos\"] = (df[\"target\"] * df[\"weight\"]).cumsum()\n        total_pos = (df[\"target\"] * df[\"weight\"]).sum()\n        df[\"lorentz\"] = df[\"cum_pos\"] / total_pos\n        df[\"gini\"] = (df[\"lorentz\"] - df[\"rand\"]) * df[\"weight\"]\n        return df[\"gini\"].sum()\n\n    def norm_gini(y_true, y_pred):\n        return weighted_gini(y_true, y_pred) / weighted_gini(\n            y_true, y_true.rename(columns={\"target\": \"prediction\"})\n        )\n\n    y_t = y_true.reset_index(drop=True)\n    y_p = y_pred.reset_index(drop=True)\n    g = norm_gini(y_t, y_p)\n    d = top_four_percent_captured(y_t, y_p)\n    return 0.5 * (g + d)\n\n\n# Load data\ndata = pd.read_csv(\"input/train_data_downsampled.csv\")\nlabels = pd.read_csv(\"input/train_labels_downsampled.csv\")\n\n# Drop categorical/date, aggregate numeric features by mean\nto_drop = [\n    \"B_30\",\n    \"B_38\",\n    \"D_114\",\n    \"D_116\",\n    \"D_117\",\n    \"D_120\",\n    \"D_126\",\n    \"D_63\",\n    \"D_64\",\n    \"D_66\",\n    \"D_68\",\n    \"S_2\",\n]\ndf = data.drop(columns=to_drop, errors=\"ignore\")\ndf_agg = df.groupby(\"customer_ID\").mean().reset_index()\n\n# Merge with labels\ndf_all = df_agg.merge(labels, on=\"customer_ID\", how=\"inner\")\nX = df_all.drop([\"customer_ID\", \"target\"], axis=1)\ny = df_all[\"target\"]\nX.fillna(-999, inplace=True)\n\n# 5-fold stratified CV\nkf = StratifiedKFold(n_splits=5, shuffle=True, random_state=42)\nscores = []\nfor tr_idx, val_idx in kf.split(X, y):\n    X_tr, X_val = X.iloc[tr_idx], X.iloc[val_idx]\n    y_tr, y_val = y.iloc[tr_idx], y.iloc[val_idx]\n    model = xgb.XGBClassifier(\n        n_estimators=100,\n   yT;

    const minColor = 125;

    this.relSize = relSize;
    this.treeInd = treeInd;
    this.size = minSize + (maxSize - minSize) * relSize;
    this.color = minColor + (maxColor - minColor) * relSize;
    this.bgCol = Math.round(Math.max(this.color / 2, 0));

    this.x = x;
    this.y = y;
    this.xT = x;
    this.yT = y - this.size / 2;
    this.xB = x;
    this.yB = y + this.size / 2;

    nodes.push(this);
  }

  startAnimation = (offset = 0) => {
    if (this.animationStart == Number.MAX_VALUE)
      this.animationStart = globalTime + offset;
  };

  child = (node) => {
    let edge = new Edge(this, node);
    this.edges.push(edge);
    edges.push(edge);
    this.hasChildren = true;
    node.isRootNode = false;
    return node;
  };

    if (globalTime - this.animationStart < 0) return;

    const mouseXlocalCoords = (mouseX - width / 2) / scaleFactor;
    const mouseYlocalCoords = (mouseY - height / 2) / scaleFactor;
    const isMouseOver =
      dist(mouseXlocalCoords, mouseYlocalCoords, this.x, this.y) <
      this.renderSize / 1.5;
    if (isMouseOver) cursor(HAND);
    if (isMouseOver && mouseIsPressed) {
      nodes.forEach((n) => (n.selected = false));
      this.selected = true;
      setCodeAndPlan(

    }

    square(
      this.x - this.renderSize / 2,
      this.y - this.renderSize / 2,
      this.renderSize,
      10,
    );

    noStroke();
    textAlign(CENTER, CENTER);
    textSize(this.renderSize / 2);
    fill(255);
    // fill(lerpColor(color(accentCol), color(255), this.animationProgress))
    text("{ }", this.x, this.y - 1);
    // DEBUG PRINT:
    // text(round(this.relSize, 2), this.x, this.y - 1)
    // text(this.treeInd, this.x, this.y + 15)

    const dotAnimThreshold = 0.85;
    if (this.isStarred && this.animationProgress >= dotAnimThreshold) {
      let dotAnimProgress =
        (this.animationProgress - dotAnimThreshold) / (1 - dotAnimThreshold);
      textSize(
        ((-3.33 * dotAnimProgress ** 2 + 4.33 * dotAnimProgress) *
          this.renderSize) /
          2,
      );
      if (this.selected) {
        fill(0);
        stroke(0);
      } else {
        fill(accentCol);
        stroke(accentCol);
      }
      strokeWeight((-(dotAnimProgress ** 2) + dotAnimProgress) * 2);
      text("*", this.x + 20, this.y - 11);
      noStroke();
    }

    if (!this.isStatic) {
      fill(bgCol);
      const progressAnimBaseSize = this.renderSize + 5;
      rect(
        this.x - progressAnimBaseSize / 2,
        this.y -
          progressAnimBaseSize / 2 +
          progressAnimBaseSize * this.animationProgress,
        progressAnimBaseSize,
        progressAnimBaseSize * (1 - this.animationProgress),
      );
    }
    if (this.animationProgress >= 0.9) {
      this.edges
        .sort((a, b) => a.color() - b.color())
        .forEach((e, i) => {
          e.startAnimation((i / this.edges.length) ** 2 * 1000);
        });
    }
  };
}

class Edge {
  nodeT;
  nodeB;
  animX = 0;
  animY = 0;
  animationStart = Number.MAX_VALUE;
  animationProgress = 0;
  isStatic = false;
  weight = 0;

  constructor(nodeT, nodeB) {
    this.nodeT = nodeT;
    this.nodeB = nodeB;
    this.weight = 2 + nodeB.relSize * 1;
  }

  color = () => this.nodeB.color;

  startAnimation = (offset = 0) => {
    if (this.animationStart == Number.MAX_VALUE)
      this.animationStart = globalTime + offset;
  };

  render = () => {
    if (globalTime - this.animationStart < 0) return;

    if (!this.isStatic) {
      this.animationProgress = animEase(
        (globalTime - this.animationStart) / 1000,
      );
      if (this.animationProgress >= 1) {
        this.isStatic = true;
        this.animX = this.nodeB.xT;
        this.animY = this.nodeB.yT;
      } else {
        this.animX = bezierPoint(
          this.nodeT.xB,
          this.nodeT.xB,
          this.nodeB.xT,
          this.nodeB.xT,
          this.animationProgress,
        );

        this.animY = bezierPoint(
          this.nodeT.yB,
          (this.nodeT.yB + this.nodeB.yT) / 2,
          (this.nodeT.yB + this.nodeB.yT) / 2,
          this.nodeB.yT,
          this.animationProgress,
        );
      }
    }
    if (this.animationProgress >= 0.97) {
      this.nodeB.startAnimation();
    }

    strokeWeight(this.weight);
    noFill();
    stroke(
      lerpColor(color(bgCol), color(accentCol), this.nodeB.relSize * 1 + 0.7),
    );
    bezier(
      this.nodeT.xB,
      this.nodeT.yB,
      this.nodeT.xB,
      (this.nodeT.yB + this.nodeB.yT) / 2,
      this.animX,
      (this.nodeT.yB + this.nodeB.yT) / 2,
      this.animX,
      this.animY,
    );
  };
}

draw = () => {
  cursor(ARROW);
  frameRate(120);
  if (!firstFrameTime && frameCount <= 1) {
    firstFrameTime = millis();
  }
  // ---- update global animation state ----
  const initialSpeedScalingEaseIO =
    (cos(min((millis() - firstFrameTime) / 8000, 1.0) * PI) + 1) / 2;
  const initialSpeedScalingEase =
    (cos(min((millis() - firstFrameTime) / 8000, 1.0) ** (1 / 2) * PI) + 1) / 2;
  const initAnimationSpeedFactor = 1.0 - 0.4 * initialSpeedScalingEaseIO;
  // update global scaling-aware clock
  globalTime += globalAnimSpeed * initAnimationSpeedFactor * deltaTime;

  if (nodes.length == 0) {
    const spacingHeight = height * 1.3;
    const spacingWidth = width * 1.3;
    treeStructData.layout.forEach((lay, index) => {
      new Node(
        spacingWidth * lay[0] - spacingWidth / 2,
        20 + spacingHeight * lay[1] - spacingHeight / 2,
        1 - treeStructData.metrics[index],
        index,
      );
    });
    treeStructData.edges.forEach((ind) => {
      nodes[ind[0]].child(nodes[ind[1]]);
    });
    nodes.forEach((n) => {
      if (n.isRootNode) n.startAnimation();
    });
    nodes[0].selected = true;
    setCodeAndPlan(
      treeStructData.code[0],
      treeStructData.plan[0],
    )
  }

  const staticNodes = nodes.filter(
    (n) => n.isStatic || n.animationProgress >= 0.7,
  );
  if (staticNodes.length > 0) {
    const largestNode = staticNodes.reduce((prev, current) =>
      prev.relSize > current.relSize ? prev : current,
    );
    if (!manualSelection) {
      if (!largestNode.selected) {
        setCodeAndPlan(
          treeStructData.code[largestNode.treeInd],
          treeStructData.plan[largestNode.treeInd],
        );
      }
      staticNodes.forEach((node) => {
        node.selected = node === largestNode;
      });
    }
  }
  background(bgCol);
  // global animation transforms
  translate(width / 2, height / 2);
  scale(scaleFactor);

  
  // ---- fg render ----
  edges.forEach((e) => e.render());
  nodes.forEach((n) => n.render());
  
};
