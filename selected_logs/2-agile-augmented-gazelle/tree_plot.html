57142857], [0.8240469208211144, 0.7857142857142857], [0.8826979472140762, 0.7857142857142857], [0.8240469208211144, 0.8571428571428572], [0.8826979472140762, 0.8571428571428572], [0.9413489736070382, 0.8571428571428572], [0.9413489736070382, 0.9285714285714286], [0.8826979472140762, 1.0], [0.9413489736070382, 1.0], [1.0, 1.0]], "plan": ["We will train a simple LightGBM regression model to predict the \u201ccount\u201d target\nusing basic features, including season, weather, temperature, humidity,\nwindspeed, and datetime decomposed into year, month, day of week, and hour. We\nwill evaluate our model via 5-fold cross-validation using the root mean squared\nlogarithmic error (RMSLE). After estimating the cross-validated RMSLE, we will\nretrain on the full training set and generate test set predictions. Finally, we\nwill save the predictions in \u201cworking/submission.csv\u201d for submission.", "We will train an XGBoost regression model on log-transformed counts using basic\nfeatures including season, weather, temperature, humidity, windspeed, holiday,\nworkingday, and datetime decomposed into year, month, weekday, and hour. We\u2019ll\nevaluate performance via 5-fold cross-validation using root mean squared\nlogarithmic error (RMSLE). After reporting the average CV RMSLE, we\u2019ll retrain\non the full training set and generate test set predictions, reversing the log-\ntransform and saving the results in \u201cworking/submission.csv\u201d. This\nstraightforward pipeline avoids complex ensembling or extensive feature\nengineering but leverages a robust tree-based learner.", "We will confirm that the sample submission\u2019s second column \u201ccount\u201d is our\ntarget, then decompose datetime into year, month, day of week, and hour\nalongside basic features. A RandomForestRegressor will be trained on\nlog1p-transformed \u201ccount\u201d using 5-fold cross-validation and evaluated with\nRMSLE. Finally, we retrain on the full dataset and generate test predictions,\nsaving them to \u201cworking/submission.csv\u201d.", "I will train a simple Ridge regression on the log1p-transformed bike counts\nusing basic temporal and weather features. I\u2019ll extract year, month, day of\nweek, and hour from the datetime, and include season, weather, temp, atemp,\nhumidity, windspeed, workingday, and holiday. I will perform 5-fold CV to\ncompute the RMSLE on the log scale (equivalent to RMSLE on counts) and print it.\nFinally, I\u2019ll retrain on all data, predict on the test set, exponentiate the\noutputs, and save the submission as \u201cworking/submission.csv\u201d.", "We will use an XGBoost regressor on the log1p-transformed target with basic\ntemporal and weather features. We\u2019ll extract year, month, day of week, and hour\nfrom the datetime alongside season, weather, temp, atemp, humidity, windspeed,\nworkingday, and holiday. Performance will be assessed via 5-fold\ncross\u2010validation using RMSLE, and then we\u2019ll retrain on the full dataset to\ngenerate test predictions. The final submission will be saved to\n\u201cworking/submission.csv\u201d.", "I propose adding cyclical features for hour and month by computing sine and\ncosine transforms, which helps the model capture their periodic nature. All\nother features and model settings remain the same, and we will evaluate via\n5-fold CV and then retrain on full data for submission.", "I propose replacing the RandomForestRegressor with a LightGBM regressor to\nbetter capture complex patterns and leverage gradient boosting. We will train on\nthe log-transformed target and use early stopping within each fold to determine\nthe optimal number of boosting rounds, then use the median of these rounds for\nthe final model. All existing cyclical and temporal features remain unchanged.\nThis single change should yield a lower RMSLE.", "I propose replacing the RandomForestRegressor with LightGBM\u2019s LGBMRegressor,\nwhich often yields better accuracy on tabular data. We will use the same\ncyclical and temporal features and train on the log1p-transformed target with\n5-fold cross\u2010validation to compute RMSLE. The LGBMRegressor will be configured\nwith learning_rate=0.05, num_leaves=31, n_estimators=1000, and n_jobs=-1. After\nevaluating CV RMSLE, we retrain on the full dataset and generate test\npredictions for submission.", "I propose adding a new feature capturing the difference between \u201catemp\u201d and\n\u201ctemp\u201d (i.e., felt vs. actual temperature), which may help the model better\ndistinguish discomfort levels and thereby improve count predictions. This new\n\u201ctemp_diff\u201d feature is easily computed and added to both train and test, and we\nthen retrain the LightGBM model with the same settings and evaluate via 5-fold\nCV to measure the impact.", "I propose adding a K-fold target encoding of the \u201chour\u201d feature, by computing\nthe mean log\u2010count per hour on the training folds and using it as an additional\nfeature (\u201chour_te\u201d) for both validation and test. This should capture systematic\nhourly demand patterns beyond cyclical encoding. We\u2019ll integrate this into our\n5-fold CV and final training pipeline with the same LightGBM settings and assess\nthe impact on RMSLE.", "We can replace xgboost with scikit-learn\u2019s built-in GradientBoostingRegressor\nwhich is available in the environment. We\u2019ll keep the same datetime feature\nextraction and log1p target, run a 5-fold CV to compute and print the RMSLE,\nthen retrain on the full data. Finally we\u2019ll predict on the test set, invert the\nlog transform, and save `submission.csv` as required.", "We can replace the unavailable XGBRegressor with sklearn\u2019s\nGradientBoostingRegressor, keeping the same log1p transformation and RMSLE\nevaluation. We perform 5\u2010fold cross\u2010validation, print the mean RMSLE, then train\non all data and output predictions to `./working/submission.csv` using the\n\u201ccount\u201d column from the sample submission. This avoids the xgboost dependency\nwhile preserving the original modeling workflow.", "I propose replacing the log1p target transformation with LightGBM\u2019s built-in\nPoisson objective to directly model count data. We\u2019ll train\nLGBMRegressor(objective='poisson') on raw counts, perform 5-fold CV to compute\nRMSLE on log1p of predictions, then retrain on full data and output test\npredictions in submission.csv. This avoids manual log transforms and often\nyields better calibration for count distributions.", "I propose adding cyclical encoding for the day-of-week feature by computing its\nsine and cosine transforms, which should help the model capture weekly patterns\nmore effectively. We\u2019ll include these new features alongside the existing hour\nand month cycles, then retrain the LightGBM model on the log1p-transformed\ntarget. We\u2019ll evaluate using 5-fold cross-validation to compute RMSLE and\nfinally retrain on the full dataset to generate test predictions. This atomic\nchange should reveal the benefit of modeling weekly periodicity.", "I suggest adding cyclical encoding for the day\u2010of\u2010year to capture fine\u2010grained\nannual seasonality beyond the coarse monthly cycles. We extract the day\u2010of\u2010year\nfrom the datetime, compute sine and cosine transforms over a 365\u2010day cycle, and\ninclude these new features. We then retrain our LightGBM model with the extended\nfeature set using 5\u2010fold CV to measure RMSLE, and finally train on all data to\ngenerate test predictions for submission.", "I replaced the unsupported `early_stopping_rounds` argument in `model.fit` with\nLightGBM callbacks for early stopping and silent logging. This lets us still\nmonitor validation loss and record the best iteration without triggering the\nTypeError. The rest of the pipeline (feature engineering, CV loops, final\ntraining, and submission) remains unchanged, and we print the CV RMSLE at the\nend.", "I propose adding a binary \u201cis_weekend\u201d feature (1 if the day of week is Saturday\nor Sunday, else 0) to help the model distinguish weekend usage patterns. We\u2019ll\ninclude this in our feature set alongside the existing cyclical and temporal\nfeatures, then retrain the LightGBM model with 5-fold CV to measure the impact\non RMSLE. Finally, we\u2019ll fit on the full data and produce the submission.", "I propose adding cyclical encoding of the ISO week-of-year to capture seasonal\npatterns at a weekly granularity. We extract the week number from the datetime,\ncompute its sine and cosine transforms, and include these new features alongside\nexisting ones. Then we rerun the same 5-fold CV with LightGBM, print the CV\nRMSLE, and generate the final submission.", "I propose adding interaction features between the hour and the\nworkingday/holiday indicators (hour \u00d7 workingday and hour \u00d7 holiday) to help the\nmodel capture the different hourly patterns on working days versus holidays.\nWe\u2019ll include these new features alongside the existing ones, then rerun 5-fold\nCV with the same LightGBM settings to measure the impact on RMSLE.", "I propose adding a K\u2010fold target encoding for the \u201cmonth\u201d feature on the\nlog\u2010transformed counts to capture average seasonal demand patterns. For each\nfold, we compute the mean log1p(count) per month on the training split and map\nit to the validation split, then apply the full\u2010data mapping to the test set,\ncreating a new \u201cmonth_te\u201d feature. We then include this feature in our LightGBM\nmodel, rerun 5\u2010fold CV to measure the impact on RMSLE, and finally retrain on\nthe full data to produce test predictions.", "I propose adding a binary \u201cis_weekend\u201d feature (1 if the day of week is Saturday\nor Sunday, else 0) to help the model differentiate weekend usage patterns. We\nwill include this feature alongside the existing temporal, cyclical, and\ninteraction features, then rerun 5-fold CV with LightGBM to measure the impact\non RMSLE. Finally, we will retrain on the full dataset and generate the\nsubmission file.", "I propose adding a K\u2010fold target encoding feature for the combination of hour\nand day-of-week. This new feature (\u201chour_dow_te\u201d) captures typical log\u2010count\npatterns for each hour-weekday group beyond cyclical encoding. We compute the\nmean log1p(count) per (hour,dayofweek) group on each training fold, map it to\nvalidation data (filling missing with the fold\u2019s global mean), and include this\nfeature alongside existing ones in the LightGBM model. Finally, we compute the\nsame mapping on the full training set for test predictions.", "I will add a K\u2010fold target encoding feature for the \u201cseason\u201d variable by\ncomputing the mean log1p(count) per season on each training fold and mapping it\nto the validation fold, then applying the full\u2010data mapping to the test set.\nThis \u201cseason_te\u201d feature should capture average seasonal demand patterns that a\nnumeric season code cannot. I will include this new feature in the LGBMRegressor\npipeline, rerun 5\u2010fold CV to print the RMSLE improvement, and then train on all\ndata to produce the final submission.", "I will add a K\u2010fold target encoding feature for the \u201cweather\u201d variable by\ncomputing the mean log1p(count) per weather category on each training fold and\nmapping it to the validation fold, then applying the full-data mapping to the\ntest set. This \u201cweather_te\u201d feature should capture systematic differences in\nrental demand under different weather conditions beyond the raw categorical\ncode. We include this new feature alongside our existing cyclical, temporal, and\ninteraction features, then rerun 5-fold CV with LightGBM to measure its impact\non RMSLE and finally retrain on all data to generate test predictions.", "I propose adding early stopping in the LightGBM cross\u2010validation to\nautomatically find the optimal number of boosting rounds and then using the\naverage best iteration count to train the final model. We will increase\n`n_estimators` to 5000, enable `early_stopping_rounds=100` on each fold (using\nthe log-transformed target for validation), record each fold\u2019s\n`best_iteration_`, compute their mean, and then retrain the model on the full\ndataset with that many trees. This should reduce overfitting and improve\ngeneralization with minimal code changes.", "I propose adding a binary \u201cis_rush_hour\u201d feature (1 if the hour is in morning\nrush 7\u20139 AM or evening rush 4\u20136 PM) to capture commuter demand peaks. This new\nfeature should complement the existing temporal and interaction features and\nhelp the model better distinguish peak usage periods. We will include it in the\nfeature set, rerun 5-fold CV with LightGBM to measure its impact on RMSLE, and\nthen retrain on the full data to generate test predictions.", "I propose ensembling multiple LightGBM models with different random seeds to\nreduce variance. Specifically, we\u2019ll train 5 LGBMRegressor models per fold,\naverage their predictions on the validation set for CV and then do the same on\nthe test set. This bagging approach is an atomic change that often yields a\nlower RMSLE. The rest of the pipeline remains unchanged.", "I will replace the unsupported `early_stopping_rounds` argument by passing the\nearly\u2010stopping callback through `callbacks`. This restores early stopping while\nusing the sklearn API. I'll import `early_stopping` and `log_evaluation` from\nLightGBM, pass them in `callbacks`, then proceed with 5\u2010fold CV to compute\nRMSLE, train the final model, predict on test data, and save `submission.csv`.", "I propose adding a continuous \u201celapsed_time\u201d feature representing the number of\nhours since the first timestamp in the dataset, which should capture long\u2010term\ntrends in bike rentals more smoothly than the coarse \u201cyear\u201d variable. We will\ncompute this feature for both train and test, include it alongside our existing\nfeatures, and rerun 5\u2010fold cross\u2010validation with the same LightGBM settings and\nearly stopping callbacks to measure its impact on RMSLE. Finally, we retrain on\nthe full dataset using the average best iteration and generate the test\nsubmission.", "I propose adding a K\u2010fold target encoding feature for the combination of season\nand hour\u2014computing the mean log1p(count) per (season, hour) group on each\ntraining fold and mapping it to the validation fold\u2014so the model learns typical\nseasonal hourly demand patterns. We then add this \u201cseason_hour_te\u201d feature to\nboth training and test sets before retraining with the same LightGBM settings\nand evaluate via 5-fold CV to measure its impact. Finally, we retrain on the\nfull dataset including this new feature and generate test predictions for\nsubmission.", "I propose adding a K-fold target encoding feature for the \u201chour\u201d variable by\ncomputing the mean log1p(count) per hour on each training fold and mapping it to\nthe validation fold, then applying the full-data mapping to the test set. This\n\u201chour_te\u201d feature should capture systematic hourly rental patterns beyond raw\ncyclical encoding. We\u2019ll include this feature in our LightGBM pipeline, perform\n5-fold cross-validation to compute RMSLE, and then retrain on all data to\nproduce the final submission.", "I propose converting low\u2010cardinality features (season, holiday, workingday,\nweather, year, month, dayofweek, hour) to pandas categorical dtype and passing\nthem as `categorical_feature` to LightGBM. This allows the model to optimize\nsplits for categorical variables and may reduce overfitting. The rest of the\npipeline (feature engineering, elapsed_time, cyclical encodings, interactions)\nremains unchanged. We rerun 5\u2010fold CV with early stopping and then train a final\nmodel on all data, printing the CV RMSLE.", "I propose replacing LightGBM\u2019s default GBDT boosting with the DART boosting_type\nto introduce dropout in the tree ensemble, which can reduce overfitting and\nvariance. We\u2019ll set drop_rate=0.1 and skip_drop=0.5 while keeping other\nhyperparameters the same, then rerun 5-fold CV to measure RMSLE and finally\ntrain on all data for the submission.", "I replaced the mean-based choice of boosting rounds with a safe fallback: if the\nmean best iteration across folds is zero, we default to the original\n`n_estimators` (5000). This ensures the final model always has a positive number\nof trees. The rest of the pipeline (feature engineering, 5-fold CV with DART,\nlog\u2010transform target, RMSLE calculation) remains unchanged. Finally, we print\nthe CV RMSLE and save `submission.csv` in `./working`.", "I propose ensembling three LGBMRegressor models with different random seeds to\nreduce variance. During 5-fold CV, we train all three models per fold and\naverage their predictions to compute a more stable RMSLE. We then average the\nbest iterations across all models to train the final ensemble on the full data,\naverage their test predictions, and save the submission.", "I propose leveraging LightGBM\u2019s native categorical feature support by converting\ndiscrete predictors (season, holiday, workingday, weather, year, month,\ndayofweek, and hour) to pandas 'category' dtype and passing them as\n`categorical_feature` in both CV and final ensemble training. This allows the\nmodel to find optimal splits for categorical variables and should further reduce\nCV RMSLE. The remaining pipeline, including cyclic features, elapsed time, and\nensemble seeds, remains unchanged. We\u2019ll print the CV ensemble RMSLE and save\nthe final submission as before.", "I propose adding polynomial features\u2014squares of temp, atemp, humidity,\nwindspeed, and the interaction temp\u00d7humidity\u2014to capture non\u2010linear effects that\nthe tree ensemble can exploit. We include these new features in both train and\ntest, keep the existing LightGBM ensemble setup with three seeds and 5\u2010fold CV,\nand then evaluate the CV RMSLE before training on full data for submission. This\natomic change should allow the model to better fit curvature in temperature and\nhumidity relationships without altering the modeling framework.", "I propose increasing the model capacity by doubling LightGBM\u2019s `num_leaves` from\n31 to 63, which lets each tree capture more complex patterns. All other\nhyperparameters, the three\u2010seed ensemble, early stopping, and feature\nengineering remain unchanged. We\u2019ll rerun 5\u2010fold CV to evaluate the impact on\nRMSLE, then retrain on the full data using the average best iteration and save\nthe submission.", "I propose increasing the model capacity by doubling LightGBM\u2019s `num_leaves` from\n31 to 63, allowing each tree to capture more complex patterns. All other\nhyperparameters, the three\u2010seed ensemble, early stopping, and the extensive\nfeature engineering remain unchanged. We will rerun 5\u2010fold CV to evaluate the\nimpact on RMSLE, then retrain on the full data using the averaged best iteration\nand save the submission.", "I propose reducing the learning rate from 0.05 to 0.01 while increasing the\nnumber of boosting rounds to 10000, allowing the model to learn more gradually\nand capture subtler patterns, controlled by early stopping. We retain\nnum_leaves=63, subsample=0.8, colsample_bytree=0.8, and the 3-seed ensemble with\n5-fold CV. We will print the CV RMSLE and retrain on the full data using the\naveraged best iteration to generate the final submission.", "I propose increasing the LightGBM tree capacity by doubling `num_leaves` from 31\nto 63, enabling each tree to model more complex interactions without changing\nthe rest of the pipeline. We\u2019ll keep the same 3\u2010seed ensemble, learning rate,\nsubsampling, and feature set, then rerun 5\u2010fold CV with early stopping to\nmeasure the impact on RMSLE. Finally, we\u2019ll retrain on the full dataset using\nthe averaged best iteration and save the submission.", "I propose increasing the LightGBM model capacity by raising `num_leaves` from 31\nto 127, which allows each tree to capture more complex interactions without\naltering the rest of the pipeline. We will keep the learning rate, subsample,\nand colsample parameters unchanged, rerun the 5-fold CV ensemble with early\nstopping, and then train the final ensemble on all data using the average best\niteration. This atomic change should further reduce the CV RMSLE by better\nfitting the non-linear patterns in the data.", "I propose expanding the ensemble to use five different random seeds instead of\nthree, which will further reduce prediction variance and potentially lower CV\nRMSLE. We will update the seed list to [42,52,62,72,82], rerun 5-fold CV with\nthe same LightGBM settings, print the new CV RMSLE, and generate the final\nsubmission by averaging over five models per fold and five final models. This\natomic change focuses on ensemble size without altering feature engineering or\nother hyperparameters.", "I propose increasing the LightGBM model capacity by doubling `num_leaves` from\n31 to 63, which allows each tree to capture more complex patterns in the data.\nAll other parameters, the five\u2010seed ensemble, early stopping, and the extensive\nfeature engineering remain unchanged. We will rerun the 5\u2010fold CV to measure the\nimpact on RMSLE and then retrain on the full data using the averaged best\niteration to generate the final submission. This single hyperparameter change\nshould help reduce bias without significantly increasing overfitting risk.", "I will add a frequency\u2010encoding feature for the combination of hour and weather,\nwhich captures how common each (hour, weather) pair is in the training data.\nThis simple encoding can help the model recognize typical rental patterns under\nspecific weather conditions at certain hours. I keep the existing LightGBM\nensemble with five seeds and 5\u2010fold CV to measure the impact on RMSLE. Finally,\nI retrain on the full data and output a submission file.", "I propose adding LightGBM\u2019s L1 and L2 regularization by setting `reg_alpha=0.1`\nand `reg_lambda=0.1` to the ensemble, which can reduce overfitting and improve\ngeneralization. We keep the existing feature engineering, 5\u2010fold CV, early\nstopping, and 5\u2010seed ensemble intact. We will measure the impact on CV RMSLE and\nthen retrain on the full data using the averaged best iteration for submission.", "I propose adding a binary \u201cis_weekend\u201d feature (1 if the day of week is Saturday\nor Sunday, else 0) to help the model distinguish weekend usage patterns\nalongside the existing cyclical and temporal features. This atomic change can\nprovide the model with explicit weekend information beyond continuous cyclical\nencodings. We will include this feature in our LightGBM ensemble pipeline, rerun\nthe 5-fold cross-validation to measure its impact on RMSLE, and finally retrain\non the full data to produce the submission.", "I propose increasing LightGBM\u2019s row and column sampling fractions from 0.8 to\n0.9 so that each tree sees more data and features, which may reduce bias and\nimprove generalization. This is an atomic hyperparameter change that can be\nevaluated by rerunning our 5-fold CV ensemble. We will keep all other settings\nand feature engineering unchanged, print the updated CV RMSLE, and regenerate\nthe submission.", "I propose increasing the LightGBM model capacity by doubling `num_leaves` from\n31 to 63, allowing each tree to capture more complex patterns in the data. We\nwill keep the existing feature engineering, ensemble of five seeds, early\nstopping, regularization, and 5\u2010fold cross\u2010validation unchanged. This single\nhyperparameter change should reduce bias and potentially lower the CV RMSLE.\nFinally, we will retrain on the full dataset using the average best iteration\nan let lastClick = 0;
let firstFrameTime = undefined;

let nodes = [];
let edges = [];

let lastScrollPos = 0;

setup = () => {
  canvas = createCanvas(...updateTargetDims());
};

class Node {
  x;
  y;
  size;
  xT;
  yT;
  xB;
  yB;
  treeInd;
  color;
  relSize;
  animationStart = Number.MAX_VALUE;
  animationProgress = 0;
  isStatic = false;
  hasChildren = false;
  isRootNode = true;
  isStarred = false;
  selected = false;
  renderSize = 10;
  edges = [];
  bgCol;

  constructor(x, y, relSize, treeInd) {
    const minSize = 35;
    const maxSize = 60;

    const maxColor = 10;
    const minColor = 125;

    this.relSize = relSize;
    this.treeInd = treeInd;
    this.size = minSize + (maxSize - minSize) * relSize;
    this.color = minColor + (maxColor - minColor) * relSize;
    this.bgCol = Math.round(Math.max(this.color / 2, 0));

    this.x = x;
    this.y = y;
    this.xT = x;
    this.yT = y - this.size / 2;
    this.xB = x;
    this.yB = y + this.size / 2;

    nodes.push(this);
  }

  startAnimation = (offset = 0) => {
    if (this.animationStart == Number.MAX_VALUE)
      this.animationStart = globalTime + offset;
  };

  child = (node) => {
    let edge = new Edge(this, node);
    this.edges.push(edge);
    edges.push(edge);
    this.hasChildren = true;
    node.isRootNode = false;
    return node;
  };

  render = () => {
    if (globalTime - this.animationStart < 0) return;

    const mouseXlocalCoords = (mouseX - width / 2) / scaleFactor;
    const mouseYlocalCoords = (mouseY - height / 2) / scaleFactor;
    const isMouseOver =
      dist(mouseXlocalCoords, mouseYlocalCoords, this.x, this.y) <
      this.renderSize / 1.5;
    if (isMouseOver) cursor(HAND);
    if (isMouseOver && mouseIsPressed) {
      nodes.forEach((n) => (n.selected = false));
      this.selected = true;
      setCodeAndPlan(
        treeStructData.code[this.treeInd],
        treeStructData.plan[this.treeInd],
      );
      manualSelection = true;
    }

    this.renderSize = this.size;
    if (!this.isStatic) {
      this.animationProgress = animEase(
        (globalTime - this.animationStart) / 1000,
      );
      if (this.animationProgress >= 1) {
        this.isStatic = true;
      } else {
        this.renderSize =
          this.size *
          (0.8 +
            0.2 *
              (-3.33 * this.animationProgress ** 2 +
                4.33 * this.animationProgress));
      }
    }

    fill(this.color);
    if (this.selected) {
      fill(accentCol);
    }

    noStroke();
    square(
      this.x - this.renderSize / 2,
      this.y - this.renderSize / 2,
      this.renderSize,
      10,
    );

    noStroke();
    textAlign(CENTER, CENTER);
    textSize(this.renderSize / 2);
    fill(255);
    // fill(lerpColor(color(accentCol), color(255), this.animationProgress))
    text("{ }", this.x, this.y - 1);
    // DEBUG PRINT:
    // text(round(this.relSize, 2), this.x, this.y - 1)
    // text(this.treeInd, this.x, this.y + 15)

    const dotAnimThreshold = 0.85;
    if (this.isStarred && this.animationProgress >= dotAnimThreshold) {
      let dotAnimProgress =
        (this.animationProgress - dotAnimThreshold) / (1 - dotAnimThreshold);
      textSize(
        ((-3.33 * dotAnimProgress ** 2 + 4.33 * dotAnimProgress) *
          this.renderSize) /
          2,
      );
      if (this.selected) {
        fill(0);
        stroke(0);
      } else {
        fill(accentCol);
        stroke(accentCol);
      }
      strokeWeight((-(dotAnimProgress ** 2) + dotAnimProgress) * 2);
      text("*", this.x + 20, this.y - 11);
      noStroke();
    }

    if (!this.isStatic) {
      fill(bgCol);
      const progressAnimBaseSize = this.renderSize + 5;
      rect(
        this.x - progressAnimBaseSize / 2,
        this.y -
          progressAnimBaseSize / 2 +
          progressAnimBaseSize * this.animationProgress,
        progressAnimBaseSize,
        progressAnimBaseSize * (1 - this.animationProgress),
      );
    }
    if (this.animationProgress >= 0.9) {
      this.edges
        .sort((a, b) => a.color() - b.color())
        .forEach((e, i) => {
          e.startAnimation((i / this.edges.length) ** 2 * 1000);
        });
    }
  };
}

class Edge {
  nodeT;
  nodeB;
  animX = 0;
  animY = 0;
  animationStart = Number.MAX_VALUE;
  animationProgress = 0;
  isStatic = false;
  weight = 0;

  constructor(nodeT, nodeB) {
    this.nodeT = nodeT;
    this.nodeB = nodeB;
    this.weight = 2 + nodeB.relSize * 1;
  }

  color = () => this.nodeB.color;

  startAnimation = (offset = 0) => {
    if (this.animationStart == Number.MAX_VALUE)
      this.animationStart = globalTime + offset;
  };

  render = () => {
    if (globalTime - this.animationStart < 0) return;

    if (!this.isStatic) {
      this.animationProgress = animEase(
        (globalTime - this.animationStart) / 1000,
      );
      if (this.animationProgress >= 1) {
        this.isStatic = true;
        this.animX = this.nodeB.xT;
        this.animY = this.nodeB.yT;
      } else {
        this.animX = bezierPoint(
          this.nodeT.xB,
          this.nodeT.xB,
          this.nodeB.xT,
          this.nodeB.xT,
          this.animationProgress,
        );

        this.animY = bezierPoint(
          this.nodeT.yB,
          (this.nodeT.yB + this.nodeB.yT) / 2,
          (this.nodeT.yB + this.nodeB.yT) / 2,
          this.nodeB.yT,
          this.animationProgress,
        );
      }
    }
    if (this.animationProgress >= 0.97) {
      this.nodeB.startAnimation();
    }

    strokeWeight(this.weight);
    noFill();
    stroke(
      lerpColor(color(bgCol), color(accentCol), this.nodeB.relSize * 1 + 0.7),
    );
    bezier(
      this.nodeT.xB,
      this.nodeT.yB,
      this.nodeT.xB,
      (this.nodeT.yB + this.nodeB.yT) / 2,
      this.animX,
      (this.nodeT.yB + this.nodeB.yT) / 2,
      this.animX,
      this.animY,
    );
  };
}

draw = () => {
  cursor(ARROW);
  frameRate(120);
  if (!firstFrameTime && frameCount <= 1) {
    firstFrameTime = millis();
  }
  // ---- update global animation state ----
  const initialSpeedScalingEaseIO =
    (cos(min((millis() - firstFrameTime) / 8000, 1.0) * PI) + 1) / 2;
  const initialSpeedScalingEase =
    (cos(min((millis() - firstFrameTime) / 8000, 1.0) ** (1 / 2) * PI) + 1) / 2;
  const initAnimationSpeedFactor = 1.0 - 0.4 * initialSpeedScalingEaseIO;
  // update global scaling-aware clock
  globalTime += globalAnimSpeed * initAnimationSpeedFactor * deltaTime;

  if (nodes.length == 0) {
    const spacingHeight = height * 1.3;
    const spacingWidth = width * 1.3;
    treeStructData.layout.forEach((lay, index) => {
      new Node(
        spacingWidth * lay[0] - spacingWidth / 2,
        20 + spacingHeight * lay[1] - spacingHeight / 2,
        1 - treeStructData.metrics[index],
        index,
      );
    });
    treeStructData.edges.forEach((ind) => {
      nodes[ind[0]].child(nodes[ind[1]]);
    });
    nodes.forEach((n) => {
      if (n.isRootNode) n.startAnimation();
    });
    nodes[0].selected = true;
    setCodeAndPlan(
      treeStructData.code[0],
      treeStructData.plan[0],
    )
  }

  const staticNodes = nodes.filter(
    (n) => n.isStatic || n.animationProgress >= 0.7,
  );
  if (staticNodes.length > 0) {
    const largestNode = staticNodes.reduce((prev, current) =>
      prev.relSize > current.relSize ? prev : current,
    );
    if (!manualSelection) {
      if (!largestNode.selected) {
        setCodeAndPlan(
          treeStructData.code[largestNode.treeInd],
          treeStructData.plan[largestNode.treeInd],
        );
      }
      staticNodes.forEach((node) => {
        node.selected = node === largestNode;
      });
    }
  }
  background(bgCol);
  // global animation transforms
  translate(width / 2, height / 2);
  scale(scaleFactor);

  
  // ---- fg render ----
  edges.forEach((e) => e.render());
  nodes.forEach((n) => n.render());
  
};
