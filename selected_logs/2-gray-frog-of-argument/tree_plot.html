let treeStructData = {"edges": [[2, 6], [2, 7], [2, 8], [2, 5], [7, 17], [8, 9], [9, 10], [10, 11], [10, 12], [11, 16], [12, 14], [12, 13], [12, 15], [14, 18], [16, 19], [16, 24], [16, 20], [16, 23], [16, 21], [21, 22], [24, 25], [25, 26], [25, 29], [25, 27], [25, 28]], "layout": [[0.0, 0.0], [0.16666666666666666, 0.0], [0.3333333333333333, 0.0], [0.5, 0.0], [0.6666666666666666, 0.0], [0.08333333333333333, 0.125], [0.25, 0.125], [0.4166666666666667, 0.125], [0.5833333333333334, 0.125], [0.5833333333333334, 0.25], [0.5833333333333334, 0.375], [0.3333333333333333, 0.5], [0.8333333333333334, 0.5], [0.6666666666666666, 0.625], [0.8333333333333334, 0.625], [1.0, 0.625], [0.3333333333333333, 0.625], [0.4166666666666667, 0.25], [0.8333333333333334, 0.75], [0.0, 0.75], [0.16666666666666666, 0.75], [0.3333333333333333, 0.75], [0.3333333333333333, 0.875], [0.5, 0.75], [0.6666666666666666, 0.75], [0.6666666666666666, 0.875], [0.4166666666666667, 1.0], [0.5833333333333334, 1.0], [0.75, 1.0], [0.9166666666666666, 1.0]], "plan": ["We will build a simple LightGBM model using only basic features: we convert the\ntransfer date into year and month, drop identifiers, and encode all categorical\nvariables. We then run a 5\u2010fold cross\u2010validation with a default LGBMRegressor\nand evaluate using RMSE. Finally we print the average CV RMSE.", "I propose extracting year, month, and day from the transfer date, dropping the\ntransaction ID and constant record status columns, and label\u2010encoding all\nremaining categorical features. We then train a default XGBoost regressor using\n5\u2010fold cross\u2010validation and evaluate performance using RMSE. This approach\nleverages a powerful tree\u2010based model without extensive hyperparameter tuning or\nensembling. Finally, we print the average CV RMSE as our baseline.", "We sample the first 2 million records to establish a fast baseline. We decompose\nthe transfer date into year and month, drop the transaction ID and the constant\nrecord status, and label\u2010encode all categorical features. We then train a\nHistGradientBoostingRegressor using 5\u2010fold cross\u2010validation and compute the RMSE\non each fold. Finally, we print the average CV RMSE as our baseline performance.", "We sample the first 2 million rows to build a fast baseline. We convert the\ntransfer date into year, month, and day, drop the transaction ID and record\nstatus columns, and label\u2010encode all remaining categorical features. We then\ntrain a Ridge regression using 5\u2010fold cross\u2010validation and evaluate using RMSE\non the original price scale. Finally, we print the average CV RMSE as our\nbaseline.", "We extract year, month, and day from the transfer date, drop the transaction ID\nand record status, and label\u2010encode all categorical variables. We then train a\nRandomForestRegressor with 100 trees using 5-fold cross\u2010validation and evaluate\nperformance using RMSE. Finally, we print the average CV RMSE as our baseline.", "I propose extracting additional temporal features\u2014specifically the day of the\nmonth and the day of the week\u2014from the transfer date to capture finer-grained\nseasonal patterns that may influence price. These new features, combined with\nyear and month, can help the model distinguish among price fluctuations within\nmonths and across weekdays. We will implement this by parsing the date into\nyear, month, day, and weekday, label\u2010encoding categoricals, and evaluating with\n5\u2010fold CV using HistGradientBoostingRegressor.", "I will apply a log1p transform to the target variable to reduce skewness and\ndiminish the influence of extreme price values. The\nHistGradientBoostingRegressor will be trained on the log-transformed prices, and\npredictions will be exponentiated back to the original scale before computing\nRMSE. This should yield lower RMSE by stabilizing variance across the target\ndistribution.", "I propose to incorporate postcode-level target encoding to capture location-\nspecific price patterns. For each cross-validation fold, we compute the mean\nprice per postcode on the training set and use this as a new numerical feature\nfor both train and validation, filling unseen postcodes with the overall mean\nprice. This K-fold target encoding injects strong location priors that the model\ncan leverage without leaking validation information. All other categorical\nfeatures remain label-encoded, and we retain year and month as temporal\nfeatures. We then evaluate using 5-fold cross-validation with\nHistGradientBoostingRegressor and report RMSE.", "I propose replacing the HistGradientBoostingRegressor with a LightGBM regressor\nconfigured with a low learning rate, a higher number of estimators, and early\nstopping on each fold\u2019s validation set. This change leverages LightGBM\u2019s\nefficiency and regularization to potentially improve predictive performance. The\nrest of the pipeline\u2014sampling, basic date feature extraction, label\u2010encoding,\nand 5\u2010fold cross\u2010validation\u2014remains the same.", "I will add a K-Fold based target encoding for the \u201cDistrict\u201d feature to inject\ndistrict-level average price information into the model. For each fold I compute\nthe mean Price per district from the training split and map this to both\ntraining and validation sets, filling unseen districts with the global training\nmean. This new encoding will be appended as an additional feature alongside the\nexisting ones. The rest of the pipeline remains unchanged, using 5-fold CV with\nLightGBM and early stopping.", "We add K-Fold target encoding for the \"County\" feature by computing the mean\nPrice per county from each training fold and mapping it to both training and\nvalidation sets, filling unseen counties with the global training mean. This\nprovides county\u2010level price information complementary to district TE. The\npipeline otherwise remains unchanged, still using label-encoding for\ncategoricals and 5\u2010fold CV with LightGBM. Finally, we include both \"district_te\"\nand \"county_te\" in the feature set and print fold and average RMSE.", "I propose adding a frequency encoding feature for the \u201cTown\u201d variable: for each\nfold, compute the number of transactions per town in the training split and map\nthese counts to both training and validation sets. This \u201ctown_count\u201d feature\ncaptures the volume/popularity signal that may influence price beyond\ncategorical labels. We include this numeric feature alongside our existing\ndistrict and county target encodings. The rest of the pipeline remains\nunchanged, using 5\u2010fold CV with LightGBM and early stopping.", "I propose augmenting the existing target-encoded features with frequency\nencoding for both \u201cDistrict\u201d and \u201cCounty\u201d to capture the popularity of each\narea. During each CV fold, we compute the count of transactions per district and\nper county in the training split, map these counts to train and validation sets\n(filling unseen categories with zero), and include \u201cdistrict_count\u201d and\n\u201ccounty_count\u201d alongside \u201cdistrict_te\u201d and \u201ccounty_te\u201d in the feature set. This\nshould help the model leverage both average price and frequency signals for each\nregion. We keep the rest of the pipeline unchanged, using 5-fold CV with\nLightGBM and early stopping.", "I propose extracting the day of month and the day of week from the transfer date\nto capture finer-grained temporal patterns that may affect price. We will add\nthese two features alongside year and month before dropping the raw date column.\nThe rest of the pipeline (label\u2010encoding, K\u2010Fold target encoding for District\nand County, frequency encoding, and 5-fold CV with LightGBM) remains unchanged\nto isolate the impact of these new date features.", "I propose extracting the outward postcode sector from the full postcode to\ncapture a finer-grained geographic signal. We will create a new column\n`postcode_out` as the substring before the space in the `Postcode`, then within\neach CV fold compute K-Fold target encoding and frequency encoding for this\nfeature similar to District and County. Finally, we include `postcode_te` and\n`postcode_count` alongside the existing encoded features in the LightGBM model.", "I will add a K-Fold target encoding for the \u201cProperty Type\u201d feature to capture\naverage price differences across property categories. During each fold, I will\ncompute the mean Price per property type on the training split and map this to\nboth training and validation sets, filling unseen codes with the global mean.\nThis property_type_te feature will be appended alongside the existing TE and FE\nfeatures. The rest of the pipeline remains unchanged, using 5-fold CV with\nLightGBM and early stopping to isolate the impact of this new encoding.", "I will rename the \"Town/City\" column to \"Town\" right after loading the data, so\nthat all subsequent references to `train_df[\"Town\"]` and `val_df[\"Town\"]` work\ncorrectly. The rest of the pipeline\u2014date feature extraction, label encoding,\ntarget and frequency encoding, LightGBM training, and 5-fold CV\u2014remains the\nsame. Finally, I\u2019ll print the per-fold RMSEs and the average CV RMSE.", "I removed all references to the non-existent \u201cPostcode\u201d column and dropped the\ntarget\u2010encoding step. Instead, I label\u2010encode every existing categorical\nvariable and train a HistGradientBoostingRegressor on these features along with\nyear and month. The script runs a 5\u2010fold cross\u2010validation and prints per\u2010fold\nand average RMSE.", "I\u2019ve removed all references to the non-existent \u201cPostcode\u201d column and the\nassociated postcode-based features. The code now only target-encodes and\nfrequency-encodes \u201cDistrict\u201d and \u201cCounty\u201d, and builds the feature list\naccordingly. It then runs 5-fold CV with LightGBM and prints the average RMSE.", "I propose applying a log1p transformation to the Price target to reduce skewness\nbefore fitting the LightGBM model, then back-transforming predictions with expm1\nto compute RMSE on the original scale. This can stabilize variance and improve\naccuracy on extreme values. All other pipeline steps (label encoding,\ntarget/frequency encoding, 5-fold CV, and LGBM with early stopping) remain\nunchanged.", "I propose replacing the K\u2010Fold target encoding for \u201cDistrict\u201d and \u201cCounty\u201d with\na smoothed target encoding that shrinks category means toward the global mean\nbased on category frequency, reducing noise from rare categories. We compute for\neach fold a smoothed encoding: (category_mean * count + global_mean * alpha) /\n(count + alpha) with alpha=20. This atomic change should stabilize the TE\nfeatures and improve generalization without altering the rest of the pipeline.\nAll other steps (label encoding, frequency encoding for Town, 5\u2010fold CV with\nLightGBM) remain the same.", "I will add a smoothed target encoding for the high\u2010cardinality \u201cPostcode\u201d\nfeature using an alpha smoothing parameter to shrink postcode means toward the\nglobal mean. For each CV fold, I\u2019ll compute the postcode group mean and count on\nthe training split, apply the smoothing formula, and map the smoothed encoding\nto both train and validation sets (filling unseen postcodes with the global\ntraining mean). This single atomic change should inject granular price\ninformation while avoiding overfitting on rare postcodes. All other steps (label\nencoding, district/county TE, town frequency encoding, LGBM with early stopping)\nremain unchanged.", "I removed all references to the nonexistent \u201cPostcode\u201d column and its smoothed\ntarget encoding, updating the feature list accordingly. The rest of the pipeline\nstays the same: basic date features, label encoding, K-Fold target encodings for\nDistrict and County, frequency encoding for Town, and 5-fold CV with LightGBM.\nThis fixes the KeyError and prints per-fold and average RMSE.", "I propose adding a continuous time feature by converting the transfer date into\nan ordinal integer (number of days since a fixed origin). This \u201cdate_ordinal\u201d\nfeature captures the overall market trend over time, giving the model direct\naccess to temporal information beyond year and month. We include this new\nfeature alongside existing ones, keeping the rest of the pipeline (label\nencoding, target/frequency encoding, LightGBM with 5-fold CV) unchanged.", "I propose augmenting the feature set with frequency encoding for both \"District\"\nand \"County\". During each CV fold, we compute the count of transactions per\ndistrict and per county in the training split, map these counts to both training\nand validation sets (filling unseen categories with zero), and include\n\u201cdistrict_count\u201d and \u201ccounty_count\u201d alongside the existing features. This adds\nlocality popularity signals that complement the target encodings and can help\nthe model better capture area-level transaction density. The rest of the\npipeline remains unchanged: basic date features, label encoding, K-Fold target\nencoding, and 5-fold CV with LightGBM and early stopping.", "I propose adding K-Fold target encoding for the \u201cTown\u201d feature to capture\ntown\u2010level average price information. For each fold, we compute the mean Price\nper town on the training split and map it to both training and validation sets,\nfilling unseen towns with the global mean. We then include this new \u201ctown_te\u201d\nfeature alongside existing district and county target encodings before training\nthe LightGBM model with 5-fold CV. This should help the model leverage finer-\ngrained locality price signals and potentially reduce RMSE.", "I propose adding a K-Fold target encoding feature for the combined year\u2010month\ngroup to capture monthly market trends in prices. For each CV fold, we compute\nthe mean Price per unique year_month value on the training split and map this to\nboth training and validation sets, filling unseen groups with the global mean.\nThis new \u201cyear_month_te\u201d feature will be appended alongside existing TE and\nfrequency features. All other pipeline steps remain unchanged to isolate the\neffect of this addition.", "I propose adding cyclical features for month and day-of-week to better capture\nseasonal patterns. We extract the weekday from the transfer date and compute\nsine/cosine transformations for both month and weekday. These continuous\ncyclical features complement the discrete year and month features and should\nhelp the model understand periodic trends. We retain the existing encoding\npipeline and 5-fold CV for fair performance comparison.", "I propose replacing the raw K-Fold target encodings for \"District\", \"County\",\nand \"Town\" with smoothed target encodings to shrink rare\u2010category means toward\nthe global mean. In each CV fold we compute the count and mean per category in\nthe training split and apply smoothing with alpha=20, then map these smoothed\nvalues into both training and validation sets. This should stabilize the encoded\nfeatures for infrequent categories and improve generalization without altering\nthe rest of the pipeline.", "I propose to augment the feature set with group\u2010wise standard deviation of\nprices for each category (\u201cDistrict\u201d, \u201cCounty\u201d, and \u201cTown\u201d) computed within each\nfold. These \u201cstd\u201d features capture the dispersion of prices in each locality and\nmay provide the model with additional information about local market\nvariability. We\u2019ll compute these in the same K-Fold loop, filling missing values\nwith the global training standard deviation, and include them alongside the\nexisting TE/FE features. This is an atomic change to the pipeline and should\nhelp improve generalization without altering other components."], "code": ["import pandas as pd\nimport numpy as np\nimport lightgbm as lgb\nfrom sklearn.model_selection import KFold\nfrom sklearn.metrics import mean_squared_error\n\n# Load only needed columns and parse date\nusecols = [\n    \"Date of Transfer\",\n    \"County\",\n    \"District\",\n    \"Duration\",\n    \"Old/New\",\n    \"PPDCategory Type\",\n    \"Property Type\",\n    \"Town/City\",\n    \"Price\",\n]\ndf = pd.read_csv(\n    \"input/price_paid_records.csv\",\n    usecols=usecols,\n    parse_dates=[\"Date of Transfer\"],\n    low_memory=False,\n)\n\n# Feature engineering\ndf[\"year\"] = df[\"Date of Transfer\"].dt.year\ndf[\"month\"] = df[\"Date of Transfer\"].dt.month\ndf.drop([\"Date of Transfer\"], axis=1, inplace=True)\n\n# Convert to categorical\ncat_cols = [\n    \"County\",\n    \"District\",\n    \"Duration\",\n    \"Old/New\",\n    \"PPDCategory Type\",\n    \"Property Type\",\n    \"Town/City\",\n]\nfor col in cat_cols:\n    df[col] = df[col].astype(\"category\")\n\n# Prepare data\nX = df.drop(\"Price\", axis=1)\ny = df[\"Price\"]\n\n# 5-fold CV\nkf = KFold(n_splits=5, shuffle=True, random_state=42)\nrmses = []\n\nfor train_idx, val_idx in kf.split(X):\n    X_train, X_val = X.iloc[train_idx], X.iloc[val_idx]\n    y_train, y_val = y.iloc[train_idx], y.iloc[val_idx]\n    model = lgb.LGBMRegressor(objective=\"regression\", n_estimators=100, n_jobs=-1)\n    model.fit(\n        X_train,\n        y_train,\n        categorical_feature=cat_cols,\n        eval_set=[(X_val, y_val)],\n        early_stopping_rounds=10,\n        verbose=False,\n    )\n    preds = model.predict(X_val)\n    rmse = mean_squared_error(y_val, preds, squared=False)\n    rmses.append(rmse)\n\nprint(f\"CV RMSE: {np.mean(rmses):.4f}\")", "import pandas as pd\nimport numpy as np\nfrom sklearn.model_selection import KFold\nfrom sklearn.preprocessing import LabelEncoder\nfrom sklearn.metrics import mean_squared_error\nfrom xgboost import XGBRegressor\n\n# Load data\ndf = pd.read_csv(\n    \"./input/price_paid_records.csv\", parse_dates=[\"Date of Transfer\"], low_memory=False\n)\n\n# Feature engineering\ndf[\"year\"] = df[\"Date of Transfer\"].dt.year\ndf[\"month\"] = df[\"Date of Transfer\"].dt.month\ndf[\"day\"] = df[\"Date of Transfer\"].dt.day\ndf = df.drop(\n    [\n        \"Date of Transfer\",\n        \"Transaction unique identifier\",\n        \"Record Status - monthly file only\",\n    ],\n    axis=1,\n)\n\n# Separate target\ny = df[\"Price\"].values\nX = df.drop(\"Price\", axis=1)\n\n# Label encode categorical features\nfor col in X.select_dtypes(include=\"object\").columns:\n    le = LabelEncoder()\n    X[col] = le.fit_transform(X[col].astype(str))\n\nX = X.values\n\n# 5-fold cross-validation\nkf = KFold(n_splits=5, shuffle=True, random_state=42)\nrmses = []\n\nfor train_idx, valid_idx in kf.split(X):\n    X_train, X_valid = X[train_idx], X[valid_idx]\n    y_train, y_valid = y[train_idx], y[valid_idx]\n\n    model = XGBRegressor(\n        n_estimators=100, learning_rate=0.1, random_state=42, n_jobs=-1, verbosity=0\n    )\n    model.fit(X_train, y_train)\n\n    preds = model.predict(X_valid)\n    rmse = mean_squared_error(y_valid, preds, squared=False)\n    rmses.append(rmse)\n    print(f\"Fold RMSE: {rmse:.4f}\")\n\nprint(f\"Average CV RMSE: {np.mean(rmses):.4f}\")", "import pandas as pd\nimport numpy as np\nfrom sklearn.model_selection import KFold\nfrom sklearn.preprocessing import LabelEncoder\nfrom sklearn.ensemble import HistGradientBoostingRegressor\nfrom sklearn.metrics import mean_squared_error\n\n# Load a sample of the data for a fast baseline\nDATA_PATH = \"./input/price_paid_records.csv\"\nNROWS = 2_000_000  # sample first 2M rows for speed\ndf = pd.read_csv(DATA_PATH, parse_dates=[\"Date of Transfer\"], nrows=NROWS)\n\n# Feature engineering\ndf[\"year\"] = df[\"Date of Transfer\"].dt.year\ndf[\"month\"] = df[\"Date of Transfer\"].dt.month\ndf = df.drop(\n    columns=[\n        \"Transaction unique identifier\",\n        \"Rec let lastClick = 0;

let nodes = [];
let edges = [];

let lastScrollPos = 0;

setup = () => {
  canvas = createCanvas(...updateTargetDims());

class Node {
  x;
  y;
  size;
  xT;
  yT;
  xB;
  yB;
  treeInd;
  color;
  relSize;
  animationStart = Number.MAX_VALUE;
  animationProgress = 0;
  isStatic = false;
  hasChildren = false;
  isRootNode = true;
  isStarred = false;
  selected = false;
  renderSize = 10;
  edges = [];
  bgCol;

  constructor(x, y, relSize, treeInd) {
    const minSize = 35;
    const maxSize = 60;

    const maxColor = 10;
    const minColor = 125;

    this.relSize = relSize;
    this.treeInd = treeInd;
    this.size = minSize + (maxSize - minSize) * relSize;
    this.color = minColor + (maxColor - minColor) * relSize;
    this.bgCol = Math.round(Math.max(this.color / 2, 0));

    this.x = x;
    this.y = y;
    this.xT = x;
    this.yT = y - this.size / 2;
    this.xB = x;
    this.yB = y + this.size / 2;

    nodes.push(this);
  }

  startAnimation = (offset = 0) => {
    if (this.animationStart == Number.MAX_VALUE)
      this.animationStart = globalTime + offset;
  };

  child = (node) => {
    let edge = new Edge(this, node);
    this.edges.push(edge);
    edges.push(edge);
    this.hasChildren = true;
    node.isRootNode = false;
    return node;
  };

  render = () => {
    if (globalTime - this.animationStart < 0) return;

    const mouseXlocalCoords = (mouseX - width / 2) / scaleFactor;
    const mouseYlocalCoords = (mouseY - height / 2) / scaleFactor;
    const isMouseOver =
      dist(mouseXlocalCoords, mouseYlocalCoords, this.x, this.y) <
      this.renderSize / 1.5;
    if (isMouseOver) cursor(HAND);
    if (isMouseOver && mouseIsPressed) {
      nodes.forEach((n) => (n.selected = false));
      this.selected = true;
      setCodeAndPlan(
        treeStructData.code[this.treeInd],
        treeStructData.plan[this.treeInd],
      );
      manualSelection = true;
    }

    this.renderSize = this.size;
    if (!this.isStatic) {
      this.animationProgress = animEase(
        (globalTime - this.animationStart) / 1000,
      );
      if (this.animationProgress >= 1) {
        this.isStatic = true;
      } else {
        this.renderSize =
          this.size *
          (0.8 +
            0.2 *
              (-3.33 * this.animationProgress ** 2 +
                4.33 * this.animationProgress));
      }
    }

    fill(this.color);
    if (this.selected) {
      fill(accentCol);
    }

    noStroke();
    square(
      this.x - this.renderSize / 2,
      this.y - this.renderSize / 2,
      this.renderSize,
      10,
    );

    noStroke();
    textAlign(CENTER, CENTER);
    textSize(this.renderSize / 2);
    fill(255);
    // fill(lerpColor(color(accentCol), color(255), this.animationProgress))
    text("{ }", this.x, this.y - 1);
    // DEBUG PRINT:
    // text(round(this.relSize, 2), this.x, this.y - 1)
    // text(this.treeInd, this.x, this.y + 15)

    const dotAnimThreshold = 0.85;
    if (this.isStarred && this.animationProgress >= dotAnimThreshold) {
      let dotAnimProgress =
        (this.animationProgress - dotAnimThreshold) / (1 - dotAnimThreshold);
      textSize(
        ((-3.33 * dotAnimProgress ** 2 + 4.33 * dotAnimProgress) *
          this.renderSize) /
          2,
      );
      if (this.selected) {
        fill(0);
        stroke(0);
      } else {
        fill(accentCol);
        stroke(accentCol);
      }
      strokeWeight((-(dotAnimProgress ** 2) + dotAnimProgress) * 2);
      text("*", this.x + 20, this.y - 11);
      noStroke();
    }

    if (!this.isStatic) {
      fill(bgCol);
      const progressAnimBaseSize = this.renderSize + 5;
      rect(
        this.x - progressAnimBaseSize / 2,
        this.y -
          progressAnimBaseSize / 2 +
          progressAnimBaseSize * this.animationProgress,
        progressAnimBaseSize,
        progressAnimBaseSize * (1 - this.animationProgress),
      );
    }
    if (this.animationProgress >= 0.9) {
      this.edges
        .sort((a, b) => a.color() - b.color())
        .forEach((e, i) => {
          e.startAnimation((i / this.edges.length) ** 2 * 1000);
        });
    }
  };
}

class Edge {
  nodeT;
  nodeB;
  animX = 0;
  animY = 0;
  animationStart = Number.MAX_VALUE;
  animationProgress = 0;
  isStatic = false;
  weight = 0;

  constructor(nodeT, nodeB) {
    this.nodeT = nodeT;
    this.nodeB = nodeB;
    this.weight = 2 + nodeB.relSize * 1;
  }

  color = () => this.nodeB.color;

  startAnimation = (offset = 0) => {
    if (this.animationStart == Number.MAX_VALUE)
      this.animationStart = globalTime + offset;
  };

  render = () => {
    if (globalTime - this.animationStart < 0) return;

    if (!this.isStatic) {
      this.animationProgress = animEase(
        (globalTime - this.animationStart) / 1000,
      );
      if (this.animationProgress >= 1) {
        this.isStatic = true;
        this.animX = this.nodeB.xT;
        this.animY = this.nodeB.yT;
      } else {
        this.animX = bezierPoint(
          this.nodeT.xB,
          this.nodeT.xB,
          this.nodeB.xT,
          this.nodeB.xT,
          this.animationProgress,
        );

        this.animY = bezierPoint(
          this.nodeT.yB,
          (this.nodeT.yB + this.nodeB.yT) / 2,
          (this.nodeT.yB + this.nodeB.yT) / 2,
          this.nodeB.yT,
          this.animationProgress,
        );
      }
    }
    if (this.animationProgress >= 0.97) {
      this.nodeB.startAnimation();
    }

    strokeWeight(this.weight);
    noFill();
    stroke(
      lerpColor(color(bgCol), color(accentCol), this.nodeB.relSize * 1 + 0.7),
    );
    bezier(
      this.nodeT.xB,
      this.nodeT.yB,
      this.nodeT.xB,
      (this.nodeT.yB + this.nodeB.yT) / 2,
      this.animX,
      (this.nodeT.yB + this.nodeB.yT) / 2,
      this.animX,
      this.animY,
    );
  };
}

draw = () => {
  cursor(ARROW);
  frameRate(120);
  if (!firstFrameTime && frameCount <= 1) {
    firstFrameTime = millis();
  }
  // ---- update global animation state ----
  const initialSpeedScalingEaseIO =
    (cos(min((millis() - firstFrameTime) / 8000, 1.0) * PI) + 1) / 2;
  const initialSpeedScalingEase =
    (cos(min((millis() - firstFrameTime) / 8000, 1.0) ** (1 / 2) * PI) + 1) / 2;
  const initAnimationSpeedFactor = 1.0 - 0.4 * initialSpeedScalingEaseIO;
  // update global scaling-aware clock
  globalTime += globalAnimSpeed * initAnimationSpeedFactor * deltaTime;

  if (nodes.length == 0) {
    const spacingHeight = height * 1.3;
    const spacingWidth = width * 1.3;
    treeStructData.layout.forEach((lay, index) => {
      new Node(
        spacingWidth * lay[0] - spacingWidth / 2,
        20 + spacingHeight * lay[1] - spacingHeight / 2,
        1 - treeStructData.metrics[index],
        index,
      );
    });
    treeStructData.edges.forEach((ind) => {
      nodes[ind[0]].child(nodes[ind[1]]);
    });
    nodes.forEach((n) => {
      if (n.isRootNode) n.startAnimation();
    });
    nodes[0].selected = true;
    setCodeAndPlan(
      treeStructData.code[0],
      treeStructData.plan[0],
    )
  }

  const staticNodes = nodes.filter(
    (n) => n.isStatic || n.animationProgress >= 0.7,
  );
  if (staticNodes.length > 0) {
    const largestNode = staticNodes.reduce((prev, current) =>
      prev.relSize > current.relSize ? prev : current,
    );
    if (!manualSelection) {
      if (!largestNode.selected) {
        setCodeAndPlan(
          treeStructData.code[largestNode.treeInd],
          treeStructData.plan[largestNode.treeInd],
        );
      }
      staticNodes.forEach((node) => {
        node.selected = node === largestNode;
      });
    }
  }
  background(bgCol);
  // global animation transforms
  translate(width / 2, height / 2);
  scale(scaleFactor);

  
  // ---- fg render ----
  edges.forEach((e) => e.render());
  nodes.forEach((n) => n.render());
  
};
